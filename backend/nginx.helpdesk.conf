# /etc/nginx/sites-available/helpdesk.conf
# Frontend (dist Vite) servido directo por Nginx, API y Socket.IO proxied al backend Node,
# y uploads servidos por Nginx mediante X-Accel-Redirect (carpeta `internal`).

upstream helpdesk_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name helpdesk.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name helpdesk.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/helpdesk.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.tudominio.com/privkey.pem;

    client_max_body_size 25M;

    # ---------- Frontend (build estático de Vite) ----------
    root /opt/helpdesk/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass         http://helpdesk_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ---------- Socket.IO ----------
    location /socket.io/ {
        proxy_pass         http://helpdesk_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---------- Uploads protegidos (X-Accel-Redirect) ----------
    # El backend responde 200 con header `X-Accel-Redirect: /_protected_uploads/<bucket>/<file>`
    # y Nginx sirve el archivo desde disco sin pasar por Node.
    location /_protected_uploads/ {
        internal;
        alias /opt/helpdesk/uploads/;
        add_header X-Content-Type-Options nosniff;
        sendfile on;
        tcp_nopush on;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
